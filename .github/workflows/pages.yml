name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build analysis site when metrics exist
        run: |
          required=(
            data/processed/pbr.json
            data/processed/roe.json
            data/processed/hhi.json
            data/processed/yield.json
          )
          ready=true
          for file in "${required[@]}"; do
            if [[ ! -s "$file" ]]; then
              ready=false
            fi
          done

          if [[ "$ready" == "true" ]]; then
            python src/render/build_site.py \
              --pbr data/processed/pbr.json \
              --roe data/processed/roe.json \
              --hhi data/processed/hhi.json \
              --yield data/processed/yield.json \
              --notes data/processed/codex_notes.md \
              --out docs/index.html
          else
            echo "Metrics are unavailable; publishing the checked-in uncalculated status page."
            grep -q "現在は未計算です" docs/index.html
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
